            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          envFrom:
            - secretRef:
                name: mobilkasa-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: webservis
  namespace: mobilkasa
spec:
  selector:
    app: webservis
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobileservis
  namespace: mobilkasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobileservis
  template:
    metadata:
      labels:
