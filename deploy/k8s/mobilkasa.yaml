# MobileKasa — Rancher/RKE2 manifestleri (namespace: mobilkasa)
# Uygula:  kubectl apply -f mobilkasa.yaml
# İmajlar registry'den değil, deploy.sh ile node'lara doğrudan yüklenir. Secret mobilkasa-secrets bu dosyada YOK — bkz. deploy/k8s/README.md
apiVersion: v1
kind: Namespace
metadata:
  name: mobilkasa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: mobilkasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: docker.io/mobilkasa/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          envFrom:
            - secretRef:
                name: mobilkasa-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: mobilkasa
spec:
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webservis
  namespace: mobilkasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webservis
  template:
    metadata:
      labels:
        app: webservis
    spec:
      containers:
